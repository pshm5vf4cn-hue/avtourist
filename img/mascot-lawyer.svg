<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Дежурный юрист онлайн">
  <defs>
    <linearGradient id="lw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8156"/>
      <stop offset="1" stop-color="#173B28"/>
    </linearGradient>
    <linearGradient id="lw-suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#276548"/>
      <stop offset="1" stop-color="#1A4A32"/>
    </linearGradient>
    <clipPath id="lw-clip"><circle cx="48" cy="48" r="48"/></clipPath>
  </defs>

  <circle cx="48" cy="48" r="48" fill="url(#lw-bg)"/>
  <circle cx="30" cy="26" r="26" fill="#FFFFFF" opacity=".07"/>

  <g clip-path="url(#lw-clip)">
    <!-- Плечи / пиджак -->
    <path d="M12 96 C12 72 28 62 48 62 C68 62 84 72 84 96 Z" fill="url(#lw-suit)"/>
    <!-- Рубашка -->
    <path d="M40 64 L48 78 L56 64 C53 66.5 51 67.5 48 67.5 C45 67.5 43 66.5 40 64 Z" fill="#F6F3E8"/>
    <!-- Воротник -->
    <path d="M40 62 L48 70 L44.5 74 Z" fill="#E8E4D2"/>
    <path d="M56 62 L48 70 L51.5 74 Z" fill="#E8E4D2"/>

    <!-- Шея -->
    <rect x="43" y="52" width="10" height="14" rx="4" fill="#E5B48C"/>
    <rect x="43" y="52" width="10" height="6" rx="3" fill="#D6A176"/>

    <!-- Голова -->
    <ellipse cx="48" cy="37" rx="16.5" ry="17.5" fill="#F2C9A2"/>
    <!-- Уши -->
    <ellipse cx="31.6" cy="39" rx="2.6" ry="3.4" fill="#F2C9A2"/>
    <ellipse cx="64.4" cy="39" rx="2.6" ry="3.4" fill="#F2C9A2"/>

    <!-- Волосы -->
    <path d="M31.5 36 Q30 19 48 18.5 Q66 19 64.5 36 Q62 27 54 26.5 Q50 26 48 26.5 Q46 26 42 26.5 Q34 27 31.5 36 Z" fill="#3A2C22"/>
    <path d="M31.5 36 Q31 32 33 29 Q32 33 33.5 36 Z" fill="#3A2C22"/>

    <!-- Гарнитура: оголовье -->
    <path d="M29.5 40 Q28.5 15 48 14.5 Q67.5 15 66.5 40" fill="none" stroke="#23282C" stroke-width="4.4" stroke-linecap="round"/>
    <!-- Амбушюры -->
    <rect x="25.5" y="35" width="8" height="13" rx="3.6" fill="#23282C"/>
    <rect x="62.5" y="35" width="8" height="13" rx="3.6" fill="#23282C"/>
    <rect x="27.4" y="37.5" width="4.2" height="8" rx="2" fill="#43D47D" opacity=".85"/>
    <rect x="64.4" y="37.5" width="4.2" height="8" rx="2" fill="#43D47D" opacity=".85"/>
    <!-- Микрофон -->
    <path d="M27 46 Q23.5 54 33.5 56.5" fill="none" stroke="#23282C" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="34.5" cy="56.8" r="3.1" fill="#23282C"/>
    <circle cx="34.5" cy="56.8" r="1.2" fill="#43D47D"/>

    <!-- Брови -->
    <path d="M37.5 33.5 Q41 31.5 44.5 33.2" fill="none" stroke="#3A2C22" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M51.5 33.2 Q55 31.5 58.5 33.5" fill="none" stroke="#3A2C22" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Глаза (открытые, смотрят вниз-вправо на монитор) -->
    <ellipse cx="41.5" cy="39" rx="3.2" ry="3.4" fill="#FFFFFF"/>
    <ellipse cx="54.5" cy="39" rx="3.2" ry="3.4" fill="#FFFFFF"/>
    <circle cx="42.4" cy="39.9" r="1.8" fill="#23282C"/>
    <circle cx="55.4" cy="39.9" r="1.8" fill="#23282C"/>
    <circle cx="43" cy="39.3" r="0.6" fill="#FFFFFF"/>
    <circle cx="56" cy="39.3" r="0.6" fill="#FFFFFF"/>
    <!-- Нос -->
    <path d="M47.6 42.5 Q47 45 45.8 45.8" fill="none" stroke="#D6A176" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Сосредоточенная улыбка -->
    <path d="M42.5 49.5 Q48 53 53.5 49.8" fill="none" stroke="#B4703F" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Клавиатура -->
  <g>
    <rect x="22" y="82" width="52" height="10" rx="4" fill="#F6F3E8"/>
    <rect x="25" y="85" width="46" height="4.4" rx="2.2" fill="#D9D4BE"/>
    <rect x="27" y="86.2" width="4" height="2.2" rx="1" fill="#FFFFFF"/>
    <rect x="33" y="86.2" width="4" height="2.2" rx="1" fill="#FFFFFF"/>
    <rect x="39" y="86.2" width="4" height="2.2" rx="1" fill="#FFFFFF"/>
    <rect x="45" y="86.2" width="4" height="2.2" rx="1" fill="#FFFFFF"/>
    <rect x="51" y="86.2" width="4" height="2.2" rx="1" fill="#FFFFFF"/>
    <rect x="57" y="86.2" width="4" height="2.2" rx="1" fill="#FFFFFF"/>
    <rect x="63" y="86.2" width="5.5" height="2.2" rx="1" fill="#FFFFFF"/>
    <!-- Руки на клавишах -->
    <ellipse cx="35" cy="81" rx="8.5" ry="5" fill="#F2C9A2"/>
    <ellipse cx="61" cy="81" rx="8.5" ry="5" fill="#F2C9A2"/>
    <path d="M28.5 80.5 Q35 77.5 41.5 80.5" fill="none" stroke="#E5B48C" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M54.5 80.5 Q61 77.5 67.5 80.5" fill="none" stroke="#E5B48C" stroke-width="1.4" stroke-linecap="round"/>
  </g>
