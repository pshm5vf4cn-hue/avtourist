<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Ответственность при ДТП: дорожный знак и суд">
  <defs>
    <linearGradient id="ko2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8156"/><stop offset="1" stop-color="#13321F"/>
    </linearGradient>
    <linearGradient id="ko2-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E86A5E"/><stop offset="1" stop-color="#C0392B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" rx="16" fill="url(#ko2-bg)"/>
  <circle cx="240" cy="330" r="150" fill="#000000" opacity=".1"/>

  <!-- дорога -->
  <rect x="0" y="236" width="480" height="64" fill="#2A2F2B"/>
  <line x1="0" y1="268" x2="480" y2="268" stroke="#F6F3E8" stroke-width="4" stroke-dasharray="30 22" opacity=".85"/>

  <!-- знак «движение запрещено» -->
  <g transform="translate(96 60)">
    <rect x="54" y="130" width="12" height="76" rx="6" fill="#8E9A90"/>
    <circle cx="60" cy="64" r="56" fill="#F6F3E8"/>
    <circle cx="60" cy="64" r="56" fill="none" stroke="#C0392B" stroke-width="12"/>
    <rect x="24" y="56" width="72" height="16" rx="8" fill="url(#ko2-red)"/>
  </g>

  <!-- машинка нарушителя -->
  <g transform="translate(216 196)">
    <path d="M8 42 Q9 31 22 27 L31 14 Q35 9 42 9 L64 9 Q71 9 75 14 L84 27 Q96 31 97 39 L97 45 Q97 50 92 50 L14 50 Q8 50 8 45 Z" fill="#43B873"/>
    <path d="M36 16 Q39 13 44 13 L53 13 L53 27 L28 27 Z" fill="#DFF3E7"/>
    <circle cx="26" cy="50" r="9" fill="#23282C"/><circle cx="26" cy="50" r="4" fill="#8E9A90"/>
    <circle cx="80" cy="50" r="9" fill="#23282C"/><circle cx="80" cy="50" r="4" fill="#8E9A90"/>
  </g>

  <!-- молоток -->
  <g transform="translate(330 84) rotate(-22)">
    <rect x="36" y="52" width="13" height="96" rx="6.5" fill="#5E3A1D"/>
    <rect x="0" y="14" width="86" height="44" rx="12" fill="#2A3A30"/>
    <rect x="0" y="14" width="86" height="15" rx="7.5" fill="#3A6B4E"/>
    <rect x="-8" y="20" width="12" height="32" rx="6" fill="#13321F" opacity=".6"/>
    <rect x="82" y="20" width="12" height="32" rx="6" fill="#13321F" opacity=".6"/>
  </g>

  <!-- колода -->
  <rect x="300" y="216" width="108" height="24" rx="8" fill="#2A3A30"/>
  <rect x="300" y="216" width="108" height="9" rx="4.5" fill="#43B873" opacity=".5"/>

  <!-- баланс правосудия -->
  <g transform="translate(428 60) scale(.62)">
    <rect x="-7" y="20" width="14" height="120" rx="7" fill="#F6F3E8"/>
    <rect x="-40" y="134" width="80" height="12" rx="6" fill="#F6F3E8"/>
    <rect x="-76" y="20" width="152" height="9" rx="4.5" fill="#F6F3E8"/>
    <line x1="-68" y1="29" x2="-82" y2="82" stroke="#F6F3E8" stroke-width="5"/>
    <line x1="-68" y1="29" x2="-54" y2="82" stroke="#F6F3E8" stroke-width="5"/>
    <path d="M-96 82 Q-68 102 -40 82" fill="none" stroke="#F5C542" stroke-width="8"/>
    <line x1="68" y1="29" x2="54" y2="82" stroke="#F6F3E8" stroke-width="5"/>
    <line x1="68" y1="29" x2="82" y2="82" stroke="#F6F3E8" stroke-width="5"/>
    <path d="M40 82 Q68 102 96 82" fill="none" stroke="#F5C542" stroke-width="8"/>
    <circle cx="0" cy="20" r="9" fill="#F5C542"/>
  </g>
</svg>
