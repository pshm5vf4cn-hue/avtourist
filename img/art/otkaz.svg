<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Письмо со штампом ОТКАЗ и стрелка жалобы в суд и ЦБ">
  <defs>
    <linearGradient id="ao-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8156"/><stop offset="1" stop-color="#13321F"/>
    </linearGradient>
    <linearGradient id="ao-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFEAD6"/>
    </linearGradient>
    <linearGradient id="ao-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E86A5E"/><stop offset="1" stop-color="#C0392B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" rx="16" fill="url(#ao-bg)"/>
  <circle cx="70" cy="250" r="100" fill="#000000" opacity=".08"/>

  <!-- письмо-отказ -->
  <g transform="rotate(-6 200 150)">
    <rect x="92" y="62" width="216" height="168" rx="12" fill="url(#ao-paper)"/>
    <path d="M92 76 L200 156 L308 76" fill="none" stroke="#D9D4BE" stroke-width="4"/>
    <rect x="118" y="176" width="120" height="7" rx="3.5" fill="#E0DAC2"/>
    <rect x="118" y="190" width="90" height="7" rx="3.5" fill="#E0DAC2"/>
    <!-- штамп ОТКАЗ -->
    <g transform="rotate(-12 214 128)">
      <rect x="146" y="106" width="136" height="44" rx="10" fill="none" stroke="#C0392B" stroke-width="5"/>
      <text x="214" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="5" fill="#C0392B">ОТКАЗ</text>
    </g>
  </g>

  <!-- стоп-ладонь -->
  <g transform="rotate(8 380 90)">
    <circle cx="380" cy="90" r="44" fill="url(#ao-red)"/>
    <circle cx="380" cy="90" r="34" fill="none" stroke="#FDFAF0" stroke-width="3" opacity=".75"/>
    <path d="M363 106 L363 82 Q363 75 370 75 L370 92 L375 92 L375 68 Q375 61 381 61 Q387 61 387 68 L387 92 L391 92 L391 73 Q391 67 397 67 Q403 67 403 73 L403 94 L407 94 L407 80 Q407 74 413 74 Q419 74 419 80 L419 108 Q419 120 404 120 L378 120 Q367 120 365 112 Z" fill="#FDFAF0"/>
  </g>

  <!-- куда жаловаться: суд + ЦБ -->
  <g>
    <path d="M330 236 Q380 208 420 170" fill="none" stroke="#F5C542" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 14"/>
    <path d="M404 168 L424 166 L416 184" fill="none" stroke="#F5C542" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- здание суда -->
    <g transform="translate(330 216)">
      <rect x="0" y="26" width="66" height="34" rx="4" fill="#E8E4D2"/>
      <path d="M-6 26 L33 4 L72 26 Z" fill="#F6F3E8"/>
      <rect x="8" y="34" width="10" height="26" fill="#2F8156"/>
      <rect x="28" y="34" width="10" height="26" fill="#2F8156"/>
      <rect x="48" y="34" width="10" height="26" fill="#2F8156"/>
      <circle cx="33" cy="16" r="4" fill="#2F8156"/>
    </g>
    <!-- колонка ЦБ -->
    <g transform="translate(414 200)">
      <rect x="0" y="30" width="52" height="38" rx="5" fill="#DFF3E7"/>
      <text x="26" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#1E5C38">ЦБ</text>
      <rect x="4" y="52" width="44" height="6" rx="3" fill="#2F8156" opacity=".5"/>
      <path d="M-3 30 L26 12 L55 30 Z" fill="#43B873"/>
    </g>
  </g>
</svg>
