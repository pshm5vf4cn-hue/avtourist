<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Полис ОСАГО защищает водителя">
  <defs>
    <linearGradient id="ko-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8156"/><stop offset="1" stop-color="#13321F"/>
    </linearGradient>
    <linearGradient id="ko-car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43B873"/><stop offset="1" stop-color="#1E5C38"/>
    </linearGradient>
    <linearGradient id="ko-shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8156"/><stop offset="1" stop-color="#13321F"/>
    </linearGradient>
    <linearGradient id="ko-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFEAD6"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" rx="16" fill="url(#ko-bg)"/>
  <circle cx="70" cy="50" r="90" fill="#FFFFFF" opacity=".05"/>

  <!-- машина -->
  <g transform="translate(76 158)">
    <path d="M20 84 Q22 64 46 58 L62 34 Q69 24 83 24 L127 24 Q141 24 148 34 L164 56 Q184 62 186 76 L186 88 Q186 96 178 96 L28 96 Q20 96 20 88 Z" fill="url(#ko-car)"/>
    <path d="M72 38 Q77 32 85 32 L102 32 L102 56 L58 56 Z" fill="#DFF3E7"/>
    <path d="M112 32 L127 32 Q134 32 139 38 L149 54 L112 54 Z" fill="#DFF3E7"/>
    <circle cx="56" cy="96" r="17" fill="#23282C"/><circle cx="56" cy="96" r="7.5" fill="#8E9A90"/>
    <circle cx="152" cy="96" r="17" fill="#23282C"/><circle cx="152" cy="96" r="7.5" fill="#8E9A90"/>
    <rect x="180" y="60" width="10" height="7" rx="3.5" fill="#F5C542"/>
    <rect x="20" y="60" width="10" height="7" rx="3.5" fill="#E86A5E"/>
  </g>

  <!-- щит с полисом -->
  <g transform="translate(286 44)">
    <path d="M84 0 L160 24 L160 92 Q160 132 84 158 Q8 132 8 92 L8 24 Z" fill="url(#ko-shield)"/>
    <path d="M84 12 L148 32 L148 90 Q148 123 84 145 Q20 123 20 90 L20 32 Z" fill="none" stroke="#43D47D" stroke-width="2.4" opacity=".5"/>
    <path d="M46 82 L78 114 L128 52" fill="none" stroke="#F6F3E8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- полис -->
    <g transform="translate(44 -8) rotate(-4)">
      <rect x="0" y="0" width="82" height="52" rx="8" fill="url(#ko-paper)"/>
      <rect x="6" y="8" width="40" height="12" rx="6" fill="#2F8156"/>
      <text x="26" y="17.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="800" letter-spacing="1" fill="#F6F3E8">ОСАГО</text>
      <rect x="6" y="26" width="66" height="4.5" rx="2.2" fill="#D9D4BE"/>
      <rect x="6" y="35" width="54" height="4.5" rx="2.2" fill="#E0DAC2"/>
    </g>
  </g>

  <!-- текст-подпись -->
  <text x="366" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#F6F3E8" opacity=".9">защита по полису</text>
</svg>
