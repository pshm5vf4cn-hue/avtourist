<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Лента новостей и полезных фактов после ДТП">
  <defs>
    <linearGradient id="nv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8156"/><stop offset="1" stop-color="#13321F"/>
    </linearGradient>
    <linearGradient id="nv-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFEAD6"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#nv-bg)"/>
  <circle cx="392" cy="60" r="86" fill="#FFFFFF" opacity=".06"/>
  <circle cx="60" cy="262" r="110" fill="#FFFFFF" opacity=".05"/>

  <!-- газета -->
  <g transform="rotate(-3 240 160)">
    <rect x="128" y="66" width="236" height="176" rx="10" fill="#0F2A1A" opacity=".35" transform="translate(6,8)"/>
    <rect x="128" y="66" width="236" height="176" rx="10" fill="url(#nv-paper)"/>
    <path d="M340,66 h14 a10,10 0 0 1 10,10 v14 z" fill="#DCD5BC"/>
    <rect x="146" y="84" width="120" height="14" rx="5" fill="#348856"/>
    <rect x="146" y="110" width="200" height="7" rx="3.5" fill="#C9CDBB"/>
    <rect x="146" y="125" width="200" height="7" rx="3.5" fill="#C9CDBB"/>
    <rect x="146" y="140" width="156" height="7" rx="3.5" fill="#C9CDBB"/>
    <rect x="146" y="163" width="92" height="58" rx="8" fill="#348856" opacity=".9"/>
    <path d="M170,205 l14,-18 10,10 12,-16 14,24 z" fill="#FDFAF0"/>
    <circle cx="178" cy="180" r="5" fill="#FDFAF0"/>
    <rect x="252" y="163" width="94" height="7" rx="3.5" fill="#C9CDBB"/>
    <rect x="252" y="178" width="94" height="7" rx="3.5" fill="#C9CDBB"/>
    <rect x="252" y="193" width="70" height="7" rx="3.5" fill="#C9CDBB"/>
    <rect x="252" y="214" width="52" height="12" rx="6" fill="#348856"/>
  </g>

  <!-- значок «ежедневно»: круглые часы -->
  <g transform="translate(88,86)">
    <circle r="30" fill="#FDFAF0"/>
    <circle r="30" fill="none" stroke="#348856" stroke-width="5"/>
    <path d="M0,-16 V0 L11,8" fill="none" stroke="#13321F" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
