<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 525" role="img" aria-label="Юрист по ДТП за работой: договор СИЛА ПРАВА, молоток и автомобиль">
  <defs>
    <linearGradient id="hm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8156"/><stop offset=".6" stop-color="#1E5C38"/><stop offset="1" stop-color="#13321F"/>
    </linearGradient>
    <linearGradient id="hm-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A5A33"/><stop offset="1" stop-color="#5E3A1D"/>
    </linearGradient>
    <linearGradient id="hm-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFEAD6"/>
    </linearGradient>
    <linearGradient id="hm-suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#276548"/><stop offset="1" stop-color="#1A4A32"/>
    </linearGradient>
    <linearGradient id="hm-car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43B873"/><stop offset="1" stop-color="#1E5C38"/>
    </linearGradient>
  </defs>

  <rect width="700" height="525" rx="24" fill="url(#hm-bg)"/>
  <circle cx="120" cy="80" r="150" fill="#FFFFFF" opacity=".05"/>
  <circle cx="620" cy="470" r="180" fill="#000000" opacity=".08"/>

  <!-- машина на фоне -->
  <g transform="translate(430 250)" opacity=".95">
    <path d="M20 96 Q22 74 48 68 L68 42 Q76 30 94 30 L158 30 Q176 30 184 42 L202 68 Q226 74 228 90 L228 106 Q228 114 220 114 L30 114 Q20 114 20 106 Z" fill="url(#hm-car)"/>
    <path d="M80 44 Q86 38 96 38 L120 38 L120 66 L62 66 Z" fill="#DFF3E7"/>
    <path d="M130 38 L158 38 Q168 38 174 46 L186 64 L130 64 Z" fill="#DFF3E7"/>
    <circle cx="66" cy="114" r="20" fill="#23282C"/><circle cx="66" cy="114" r="9" fill="#8E9A90"/>
    <circle cx="182" cy="114" r="20" fill="#23282C"/><circle cx="182" cy="114" r="9" fill="#8E9A90"/>
    <rect x="222" y="82" width="12" height="8" rx="4" fill="#F5C542"/>
    <rect x="22" y="82" width="12" height="8" rx="4" fill="#E86A5E"/>
  </g>

  <!-- стол -->
  <rect x="0" y="380" width="700" height="145" fill="url(#hm-desk)"/>
  <rect x="0" y="380" width="700" height="14" fill="#A9743F"/>

  <!-- молоток на столе -->
  <g transform="translate(520 392) rotate(-16)">
    <rect x="0" y="30" width="12" height="86" rx="6" fill="#5E3A1D"/>
    <rect x="-26" y="0" width="64" height="36" rx="10" fill="#2A3A30"/>
    <rect x="-26" y="0" width="64" height="12" rx="6" fill="#3A6B4E"/>
  </g>

  <!-- юрист (бюст) -->
  <g transform="translate(96 108)">
    <!-- плечи -->
    <path d="M0 272 Q4 218 76 212 L80 200 L84 212 Q156 218 160 272 Z" fill="url(#hm-suit)"/>
    <path d="M64 214 L80 240 L96 214 Q88 220 80 220 Q72 220 64 214 Z" fill="#F6F3E8"/>
    <!-- шея и голова -->
    <rect x="66" y="176" width="28" height="34" rx="12" fill="#E5B48C"/>
    <ellipse cx="80" cy="128" rx="46" ry="50" fill="#F2C9A2"/>
    <path d="M34 118 Q32 74 80 72 Q128 74 126 118 Q118 92 102 90 Q90 88 80 90 Q70 88 58 90 Q42 92 34 118 Z" fill="#3A2C22"/>
    <!-- глаза, брови, нос, улыбка -->
    <path d="M52 118 Q60 112 70 116" fill="none" stroke="#3A2C22" stroke-width="4" stroke-linecap="round"/>
    <path d="M90 116 Q100 112 108 118" fill="none" stroke="#3A2C22" stroke-width="4" stroke-linecap="round"/>
    <circle cx="61" cy="130" r="5" fill="#23282C"/><circle cx="63" cy="128.4" r="1.6" fill="#FFFFFF"/>
    <circle cx="99" cy="130" r="5" fill="#23282C"/><circle cx="101" cy="128.4" r="1.6" fill="#FFFFFF"/>
    <path d="M76 138 Q74 146 70 148" fill="none" stroke="#D6A176" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M66 158 Q80 166 94 158" fill="none" stroke="#B4703F" stroke-width="4" stroke-linecap="round"/>
    <!-- очки -->
    <circle cx="61" cy="130" r="12" fill="none" stroke="#23282C" stroke-width="3"/>
    <circle cx="99" cy="130" r="12" fill="none" stroke="#23282C" stroke-width="3"/>
    <line x1="73" y1="130" x2="87" y2="130" stroke="#23282C" stroke-width="3"/>
    <!-- гарнитура -->
    <path d="M32 134 Q28 66 80 62 Q132 66 128 134" fill="none" stroke="#23282C" stroke-width="8" stroke-linecap="round"/>
    <rect x="22" y="122" width="16" height="30" rx="7" fill="#23282C"/>
    <path d="M28 150 Q22 166 42 170" fill="none" stroke="#23282C" stroke-width="5" stroke-linecap="round"/>
    <circle cx="44" cy="171" r="6" fill="#23282C"/><circle cx="44" cy="171" r="2.4" fill="#43D47D"/>
  </g>

  <!-- договор СИЛА ПРАВА на столе -->
  <g transform="translate(240 300) rotate(-3)">
    <rect x="0" y="0" width="220" height="150" rx="12" fill="url(#hm-paper)" stroke="#D9D4BE" stroke-width="2"/>
    <rect x="12" y="12" width="196" height="126" rx="8" fill="none" stroke="#C9C3A8" stroke-width="1.4" opacity=".7"/>
    <!-- лого щит -->
    <path d="M30 24 L52 30 L52 52 Q52 66 41 72 Q30 66 30 52 Z" fill="#2F8156"/>
    <path d="M36 36 L48 36 M36 45 L45 45" stroke="#F6F3E8" stroke-width="3" stroke-linecap="round"/>
    <text x="62" y="42" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1" fill="#1E5C38">СИЛА</text>
    <text x="62" y="59" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1" fill="#2F8156">ПРАВА</text>
    <rect x="150" y="28" width="46" height="14" rx="7" fill="#EEF5F0" stroke="#2F8156" stroke-width="1.2"/>
    <text x="173" y="38.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#1E5C38">ДОГОВОР</text>
    <rect x="30" y="84" width="150" height="6" rx="3" fill="#C9C3A8"/>
    <rect x="30" y="98" width="164" height="6" rx="3" fill="#E0DAC2"/>
    <rect x="30" y="112" width="140" height="6" rx="3" fill="#E0DAC2"/>
    <path d="M30 130 Q46 122 64 128 T108 126" fill="none" stroke="#55604F" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="176" cy="118" r="17" fill="#2F8156" opacity=".92"/>
    <circle cx="176" cy="118" r="12" fill="none" stroke="#F6F3E8" stroke-width="1.6" opacity=".85"/>
    <text x="176" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="6.4" font-weight="700" fill="#F6F3E8">СИЛА</text>
    <text x="176" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="6.4" font-weight="700" fill="#F6F3E8">ПРАВА</text>
  </g>

  <!-- часы на столе -->
  <g transform="translate(110 420)">
    <circle cx="40" cy="40" r="34" fill="#FDFAF0" stroke="#2A3A30" stroke-width="6"/>
    <line x1="40" y1="40" x2="40" y2="20" stroke="#1E5C38" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="40" x2="54" y2="48" stroke="#2F8156" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="40" cy="40" r="4" fill="#F5C542"/>
  </g>
</svg>
