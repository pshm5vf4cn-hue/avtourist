<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Виновник ДТП возмещает ущерб потерпевшему">
  <defs>
    <linearGradient id="kv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8156"/><stop offset="1" stop-color="#13321F"/>
    </linearGradient>
    <linearGradient id="kv-car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43B873"/><stop offset="1" stop-color="#1E5C38"/>
    </linearGradient>
    <linearGradient id="kv-coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7D774"/><stop offset="1" stop-color="#E0A93B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" rx="16" fill="url(#kv-bg)"/>
  <circle cx="60" cy="240" r="100" fill="#000000" opacity=".08"/>

  <!-- повреждённая машина -->
  <g transform="translate(236 96)">
    <path d="M20 84 Q22 64 46 58 L62 34 Q69 24 83 24 L127 24 Q141 24 148 34 L164 56 Q184 62 186 76 L186 88 Q186 96 178 96 L28 96 Q20 96 20 88 Z" fill="url(#kv-car)"/>
    <path d="M72 38 Q77 32 85 32 L102 32 L102 56 L58 56 Z" fill="#DFF3E7"/>
    <path d="M112 32 L127 32 Q134 32 139 38 L149 54 L112 54 Z" fill="#DFF3E7"/>
    <path d="M150 66 L166 60 L160 72 L178 70" fill="none" stroke="#13321F" stroke-width="3" stroke-linecap="round" opacity=".75"/>
    <circle cx="56" cy="96" r="17" fill="#23282C"/><circle cx="56" cy="96" r="7.5" fill="#8E9A90"/>
    <circle cx="152" cy="96" r="17" fill="#23282C"/><circle cx="152" cy="96" r="7.5" fill="#8E9A90"/>
  </g>

  <!-- виновник (слева, опустил голову) -->
  <g transform="translate(56 96)">
    <rect x="0" y="76" width="52" height="86" rx="18" fill="#2E4A3A"/>
    <circle cx="26" cy="48" r="24" fill="#E8B78D"/>
    <path d="M2 44 Q1 20 26 19 Q51 20 50 44 Q45 30 36 28 Q30 27 26 28 Q22 27 16 28 Q7 30 2 44 Z" fill="#23282C"/>
    <path d="M14 52 Q18 55 22 52" fill="none" stroke="#23282C" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M30 52 Q34 55 38 52" fill="none" stroke="#23282C" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M20 64 Q26 61 32 64" fill="none" stroke="#B4703F" stroke-width="2.4" stroke-linecap="round"/>
    <text x="26" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#F6F3E8" opacity=".75">виновник</text>
  </g>

  <!-- потерпевший (справа) -->
  <g transform="translate(392 92)">
    <rect x="0" y="80" width="52" height="86" rx="18" fill="#1A4A32"/>
    <circle cx="26" cy="52" r="24" fill="#F2C9A2"/>
    <path d="M2 48 Q1 24 26 23 Q51 24 50 48 Q45 34 36 32 Q30 31 26 32 Q22 31 16 32 Q7 34 2 48 Z" fill="#3A2C22"/>
    <circle cx="18" cy="54" r="2.6" fill="#23282C"/><circle cx="34" cy="54" r="2.6" fill="#23282C"/>
    <path d="M19 64 Q26 69 33 64" fill="none" stroke="#B4703F" stroke-width="2.4" stroke-linecap="round"/>
    <text x="26" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#F6F3E8" opacity=".75">потерпевший</text>
  </g>

  <!-- передача денег -->
  <path d="M128 168 Q210 130 268 128" fill="none" stroke="#F5C542" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 13"/>
  <path d="M254 118 L272 128 L256 140" fill="none" stroke="#F5C542" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(172 118) rotate(-10)">
    <rect x="0" y="0" width="64" height="34" rx="8" fill="url(#kv-coin)"/>
    <circle cx="32" cy="17" r="10" fill="#FDFAF0" opacity=".85"/>
    <text x="32" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#5E3A1D">₽</text>
  </g>

  <!-- документ СИЛА ПРАВА -->
  <g transform="translate(316 226) rotate(-4)">
    <rect x="0" y="0" width="118" height="44" rx="8" fill="#F6F3E8"/>
    <path d="M10 9 L22 12 L22 24 Q22 32 16 35 Q10 32 10 24 Z" fill="#2F8156"/>
    <text x="32" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#1E5C38">СИЛА ПРАВА</text>
    <rect x="32" y="28" width="72" height="5" rx="2.5" fill="#D9D4BE"/>
  </g>
</svg>
