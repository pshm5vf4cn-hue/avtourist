<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Прайс-лист услуг СИЛА ПРАВА и калькулятор">
  <defs>
    <linearGradient id="kt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8156"/><stop offset="1" stop-color="#13321F"/>
    </linearGradient>
    <linearGradient id="kt-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFEAD6"/>
    </linearGradient>
    <linearGradient id="kt-calc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A6B4E"/><stop offset="1" stop-color="#1A4A32"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" rx="16" fill="url(#kt-bg)"/>
  <circle cx="70" cy="50" r="90" fill="#FFFFFF" opacity=".05"/>

  <!-- прайс-лист -->
  <g transform="rotate(-3 200 150)">
    <rect x="92" y="36" width="216" height="228" rx="14" fill="url(#kt-paper)"/>
    <rect x="104" y="48" width="192" height="204" rx="9" fill="none" stroke="#C9C3A8" stroke-width="1.6" opacity=".7"/>
    <path d="M118 58 L140 64 L140 86 Q140 99 129 105 Q118 99 118 86 Z" fill="#2F8156"/>
    <path d="M124 70 L136 70 M124 79 L133 79" stroke="#F6F3E8" stroke-width="3" stroke-linecap="round"/>
    <text x="150" y="74" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#1E5C38">СИЛА ПРАВА</text>
    <text x="150" y="92" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2F8156">цены и услуги</text>
    <!-- строки прайса -->
    <g>
      <rect x="118" y="118" width="118" height="6" rx="3" fill="#C9C3A8"/>
      <rect x="258" y="114" width="34" height="14" rx="7" fill="#EEF5F0" stroke="#2F8156" stroke-width="1.3"/>
      <text x="275" y="124.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.6" font-weight="800" fill="#1E5C38">0 ₽</text>
      <rect x="118" y="140" width="132" height="6" rx="3" fill="#E0DAC2"/>
      <rect x="258" y="136" width="34" height="14" rx="7" fill="#EEF5F0" stroke="#2F8156" stroke-width="1.3"/>
      <text x="275" y="146.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.6" font-weight="800" fill="#1E5C38">от 25%</text>
      <rect x="118" y="162" width="110" height="6" rx="3" fill="#E0DAC2"/>
      <rect x="258" y="158" width="34" height="14" rx="7" fill="#EEF5F0" stroke="#2F8156" stroke-width="1.3"/>
      <text x="275" y="168.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.6" font-weight="800" fill="#1E5C38">фикс</text>
      <rect x="118" y="184" width="126" height="6" rx="3" fill="#E0DAC2"/>
      <rect x="258" y="180" width="34" height="14" rx="7" fill="#EEF5F0" stroke="#2F8156" stroke-width="1.3"/>
      <text x="275" y="190.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.6" font-weight="800" fill="#1E5C38">0 ₽</text>
    </g>
    <rect x="118" y="212" width="164" height="24" rx="12" fill="#2F8156"/>
    <text x="200" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="800" fill="#F6F3E8">консультация — бесплатно</text>
  </g>

  <!-- калькулятор -->
  <g transform="translate(330 70) rotate(6)">
    <rect x="0" y="0" width="104" height="142" rx="14" fill="url(#kt-calc)"/>
    <rect x="12" y="12" width="80" height="30" rx="6" fill="#DFF3E7"/>
    <text x="82" y="33" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#1E5C38">48 500</text>
    <g fill="#F6F3E8">
      <rect x="12" y="52" width="22" height="16" rx="4"/><rect x="41" y="52" width="22" height="16" rx="4"/><rect x="70" y="52" width="22" height="16" rx="4"/>
      <rect x="12" y="74" width="22" height="16" rx="4"/><rect x="41" y="74" width="22" height="16" rx="4"/><rect x="70" y="74" width="22" height="16" rx="4"/>
      <rect x="12" y="96" width="22" height="16" rx="4"/><rect x="41" y="96" width="22" height="16" rx="4"/><rect x="70" y="96" width="22" height="16" rx="4"/>
    </g>
    <rect x="41" y="118" width="22" height="16" rx="4" fill="#F5C542"/>
    <rect x="12" y="118" width="22" height="16" rx="4" fill="#F6F3E8" opacity=".6"/>
    <rect x="70" y="118" width="22" height="16" rx="4" fill="#F6F3E8" opacity=".6"/>
  </g>

  <!-- монетка -->
  <circle cx="76" cy="238" r="24" fill="#F5C542" stroke="#B9831F" stroke-width="3"/>
  <text x="76" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#5E3A1D">₽</text>
</svg>
