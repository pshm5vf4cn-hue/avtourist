<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Неустойка 1% в день: часы, календарь и растущий процент">
  <defs>
    <linearGradient id="an-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F8156"/><stop offset="1" stop-color="#13321F"/>
    </linearGradient>
    <linearGradient id="an-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFEAD6"/>
    </linearGradient>
    <linearGradient id="an-coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7D774"/><stop offset="1" stop-color="#E0A93B"/>
    </linearGradient>
    <linearGradient id="an-grow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#43D47D"/><stop offset="1" stop-color="#F5C542"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" rx="16" fill="url(#an-bg)"/>
  <circle cx="60" cy="40" r="90" fill="#FFFFFF" opacity=".05"/>

  <!-- календарь -->
  <g transform="rotate(-5 130 130)">
    <rect x="52" y="52" width="150" height="150" rx="14" fill="#1A4A32"/>
    <rect x="52" y="52" width="150" height="38" rx="14" fill="#C0392B"/>
    <rect x="60" y="94" width="134" height="100" rx="8" fill="url(#an-paper)"/>
    <rect x="82" y="40" width="10" height="24" rx="5" fill="#D9D4BE"/>
    <rect x="162" y="40" width="10" height="24" rx="5" fill="#D9D4BE"/>
    <text x="127" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#F6F3E8">СРОКИ</text>
    <g fill="#D9D4BE">
      <circle cx="82" cy="116" r="6"/><circle cx="108" cy="116" r="6"/><circle cx="134" cy="116" r="6"/><circle cx="160" cy="116" r="6"/>
      <circle cx="82" cy="140" r="6"/><circle cx="108" cy="140" r="6"/><circle cx="134" cy="140" r="6"/>
      <circle cx="82" cy="164" r="6"/><circle cx="108" cy="164" r="6"/><circle cx="134" cy="164" r="6"/><circle cx="160" cy="164" r="6"/>
    </g>
    <circle cx="160" cy="140" r="10" fill="#C0392B"/>
    <text x="160" y="144.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">20</text>
  </g>

  <!-- график роста 1% в день -->
  <path d="M238 210 L300 168 L348 182 L420 118" fill="none" stroke="url(#an-grow)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M398 112 L428 112 L428 142" fill="none" stroke="#F5C542" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="168" r="7" fill="#F6F3E8"/>
  <circle cx="348" cy="182" r="7" fill="#F6F3E8"/>
  <line x1="238" y1="236" x2="428" y2="236" stroke="#F6F3E8" stroke-width="3" opacity=".4"/>

  <!-- песочные часы -->
  <g transform="translate(392 44)">
    <path d="M18 0 L66 0 L66 8 Q66 30 46 42 Q66 54 66 76 L66 84 L18 84 L18 76 Q18 54 38 42 Q18 30 18 8 Z" fill="#DFF3E7" opacity=".28"/>
    <path d="M22 6 L62 6 Q60 26 44 38 L40 42 L44 46 Q60 58 62 78 L22 78 Q24 58 40 46 L44 42 L40 38 Q24 26 22 6 Z" fill="url(#an-paper)" opacity=".92"/>
    <path d="M33 16 L51 16 L44 36 Z" fill="#E0A93B"/>
    <path d="M33 70 L51 70 L42 50 Z" fill="#E0A93B"/>
    <rect x="14" y="0" width="56" height="8" rx="4" fill="#5E3A1D"/>
    <rect x="14" y="76" width="56" height="8" rx="4" fill="#5E3A1D"/>
  </g>

  <!-- монеты -->
  <ellipse cx="258" cy="256" rx="26" ry="9" fill="#B9831F"/>
  <rect x="232" y="234" width="52" height="22" rx="10" fill="url(#an-coin)"/>
  <ellipse cx="258" cy="234" rx="26" ry="9" fill="#F7D774"/>
  <ellipse cx="258" cy="234" rx="16" ry="5" fill="none" stroke="#B9831F" stroke-width="1.6" opacity=".55"/>

  <!-- бейдж 1% в день -->
  <g transform="rotate(6 300 80)">
    <rect x="244" y="56" width="116" height="46" rx="12" fill="#F5C542"/>
    <text x="302" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="800" fill="#5E3A1D">1% в день</text>
  </g>
</svg>
