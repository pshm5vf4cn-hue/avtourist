      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFEAD6"/>
    </linearGradient>
    <linearGradient id="rf-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E86A5E"/><stop offset="1" stop-color="#C0392B"/>
