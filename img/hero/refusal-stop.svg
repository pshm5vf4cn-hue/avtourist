    <rect x="72" y="132" width="60" height="5" rx="2.5" fill="#E0DAC2"/>
    <rect x="72" y="142" width="44" height="5" rx="2.5" fill="#E0DAC2"/>
  </g>
  <!-- штамп ОТКАЗ -->
  <g transform="rotate(-14 128 104)">
