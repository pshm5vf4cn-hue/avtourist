<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Договор и возмещение">
  <defs>
    <linearGradient id="cm-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFEAD6"/>
    </linearGradient>
    <linearGradient id="cm-coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7D774"/><stop offset="1" stop-color="#E0A93B"/>
    </linearGradient>
    <linearGradient id="cm-pen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F8156"/><stop offset="1" stop-color="#173B28"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="178" rx="90" ry="13" fill="#13321F" opacity=".10"/>
  <!-- договор -->
  <g transform="rotate(-4 108 104)">
    <rect x="52" y="40" width="112" height="122" rx="10" fill="url(#cm-paper)" stroke="#D9D4BE" stroke-width="1.5"/>
    <rect x="62" y="50" width="92" height="102" rx="6" fill="none" stroke="#C9C3A8" stroke-width="1.2" opacity=".7"/>
    <rect x="70" y="60" width="50" height="6" rx="3" fill="#2F8156"/>
    <rect x="70" y="74" width="76" height="5" rx="2.5" fill="#C9C3A8"/>
    <rect x="70" y="85" width="76" height="5" rx="2.5" fill="#E0DAC2"/>
    <rect x="70" y="96" width="60" height="5" rx="2.5" fill="#E0DAC2"/>
    <rect x="70" y="107" width="70" height="5" rx="2.5" fill="#E0DAC2"/>
    <!-- строка суммы -->
    <rect x="70" y="122" width="40" height="12" rx="6" fill="#EEF5F0" stroke="#2F8156" stroke-width="1.4"/>
    <text x="90" y="131.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#1E5C38">₽ ₽ ₽</text>
    <!-- подпись -->
    <path d="M70 144 Q80 138 92 143 T118 141" fill="none" stroke="#55604F" stroke-width="1.8" stroke-linecap="round" opacity=".75"/>
  </g>
  <!-- ручка -->
  <g transform="rotate(40 178 108)">
    <rect x="172" y="62" width="11" height="64" rx="5.5" fill="url(#cm-pen)"/>
    <path d="M172 126 L177.5 142 L183 126 Z" fill="#13321F"/>
    <rect x="172" y="62" width="11" height="12" rx="5.5" fill="#F5C542"/>
  </g>
  <!-- монеты -->
  <g>
    <ellipse cx="70" cy="164" rx="22" ry="7.5" fill="#B9831F"/>
    <rect x="48" y="146" width="44" height="18" rx="8" fill="url(#cm-coin)"/>
    <ellipse cx="70" cy="146" rx="22" ry="7.5" fill="#F7D774"/>
    <ellipse cx="70" cy="146" rx="14" ry="4.6" fill="none" stroke="#B9831F" stroke-width="1.5" opacity=".55"/>
    <ellipse cx="186" cy="168" rx="17" ry="6" fill="#B9831F"/>
    <rect x="169" y="154" width="34" height="14" rx="6" fill="url(#cm-coin)"/>
    <ellipse cx="186" cy="154" rx="17" ry="6" fill="#F7D774"/>
  </g>
</svg>
