<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Рост выплаты">
  <defs>
    <linearGradient id="mr-note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43B873"/><stop offset="1" stop-color="#1E5C38"/>
    </linearGradient>
    <linearGradient id="mr-coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7D774"/><stop offset="1" stop-color="#E0A93B"/>
    </linearGradient>
    <linearGradient id="mr-arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2F8156"/><stop offset="1" stop-color="#43D47D"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="176" rx="86" ry="14" fill="#13321F" opacity=".10"/>
  <!-- банкнота -->
  <g transform="rotate(-6 120 110)">
    <rect x="46" y="66" width="150" height="86" rx="12" fill="url(#mr-note)"/>
    <rect x="54" y="74" width="134" height="70" rx="8" fill="none" stroke="#F6F3E8" stroke-opacity=".55" stroke-width="2.5"/>
    <circle cx="121" cy="109" r="22" fill="#F6F3E8" opacity=".92"/>
    <text x="121" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#1E5C38">₽</text>
    <circle cx="66" cy="86" r="4" fill="#F6F3E8" opacity=".6"/>
    <circle cx="176" cy="132" r="4" fill="#F6F3E8" opacity=".6"/>
  </g>
  <!-- монеты -->
  <g>
    <ellipse cx="58" cy="156" rx="26" ry="9" fill="#B9831F"/>
    <rect x="32" y="136" width="52" height="20" rx="9" fill="url(#mr-coin)"/>
    <ellipse cx="58" cy="136" rx="26" ry="9" fill="#F7D774"/>
    <ellipse cx="58" cy="136" rx="17" ry="5.5" fill="none" stroke="#B9831F" stroke-width="1.6" opacity=".55"/>
    <ellipse cx="186" cy="162" rx="20" ry="7" fill="#B9831F"/>
    <rect x="166" y="146" width="40" height="16" rx="7" fill="url(#mr-coin)"/>
    <ellipse cx="186" cy="146" rx="20" ry="7" fill="#F7D774"/>
  </g>
  <!-- стрелка роста -->
  <path d="M62 60 L104 34 L150 44 L190 18" fill="none" stroke="url(#mr-arrow)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M176 14 L196 14 L196 34" fill="none" stroke="#43D47D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
