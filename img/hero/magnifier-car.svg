<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Экспертиза автомобиля">
  <defs>
    <linearGradient id="mg-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F6EE" stop-opacity=".9"/><stop offset="1" stop-color="#B7DCC6" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="mg-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A6B4E"/><stop offset="1" stop-color="#173B28"/>
    </linearGradient>
    <linearGradient id="mg-car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43B873"/><stop offset="1" stop-color="#1E5C38"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="178" rx="90" ry="13" fill="#13321F" opacity=".10"/>
  <!-- машина под лупой -->
  <g>
    <path d="M52 146 Q54 132 72 128 L86 112 Q92 104 104 104 L142 104 Q154 104 160 112 L172 128 Q188 132 190 142 L190 152 Q190 158 184 158 L58 158 Q52 158 52 152 Z" fill="url(#mg-car)"/>
    <path d="M92 116 Q96 112 104 112 L118 112 L118 130 L78 130 Z" fill="#DFF3E7"/>
    <path d="M126 112 L142 112 Q149 112 153 117 L162 128 L126 128 Z" fill="#DFF3E7"/>
    <circle cx="84" cy="158" r="13" fill="#23282C"/>
    <circle cx="84" cy="158" r="6" fill="#8E9A90"/>
    <circle cx="158" cy="158" r="13" fill="#23282C"/>
    <circle cx="158" cy="158" r="6" fill="#8E9A90"/>
    <!-- повреждение -->
    <path d="M130 138 L142 142 L136 148 L150 150" fill="none" stroke="#13321F" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
  </g>
  <!-- лупа -->
  <g transform="rotate(-18 150 80)">
    <circle cx="150" cy="76" r="52" fill="url(#mg-glass)" stroke="url(#mg-rim)" stroke-width="10"/>
    <path d="M118 52 Q132 38 156 36" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    <rect x="184" y="112" width="16" height="56" rx="8" fill="url(#mg-rim)" transform="rotate(-40 192 140)"/>
    <!-- увеличенная трещина в лупе -->
    <g transform="translate(24 10) scale(1.25)">
      <path d="M98 96 L112 100 L104 108 L122 110 L112 120" fill="none" stroke="#1E5C38" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="98" cy="96" r="3" fill="#1E5C38"/>
    </g>
  </g>
  <!-- галочка -->
  <circle cx="196" cy="46" r="17" fill="#2F8156"/>
  <path d="M188 46 L194 52 L205 40" fill="none" stroke="#F6F3E8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
